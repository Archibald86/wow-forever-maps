name: Publish WoW Forever Maps to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate static site
        shell: bash
        run: |
          test -s index.html
          test -s atlas.html
          test -s forever-theme.css
          test -s hero-v4.css
          test -s wow-forever-hero-3344.jpg
          test -s wow-forever-hero-mobile.webp
          test -s data.js
          test -s data.json
          test -s app-core.js
          test -s atlas.js
          test -s home.js
          test -s settings.js
          test -s coverage.json
          test -s login-gates.jpg
          test -d maps
          python3 - <<'PY'
          import json, pathlib, re
          d=json.loads(pathlib.Path('data.json').read_text(encoding='utf-8'))
          assert d['maps'], 'Missing maps'
          for m in d['maps']:
              p=pathlib.Path('maps')/(m['id']+'.jpg')
              assert p.is_file(), f'Missing map: {p}'
              assert m['herb_count']==len(d['herbs'].get(m['id'],[])), f"Herb count mismatch {m['id']}"
              assert m['ore_count']==len(d['ore'].get(m['id'],[])), f"Ore count mismatch {m['id']}"
          for page in ['index.html','atlas.html']:
              s=pathlib.Path(page).read_text(encoding='utf-8')
              assert 'forever-theme.css' in s
              assert 'app-core.js?v=3.3' in s
          print('OK: validated',len(d['maps']),'map zones')
          PY
      - name: Verify reproducible data build
        run: python3 tools/build_data.py --check
      - name: Test coordinate decoding
        run: python3 -m unittest discover -s tests -v
      - name: Install browser regression runner
        run: |
          npm install --prefix "$RUNNER_TEMP/wow-layout" playwright@1.62.1 --no-audit --no-fund
          node "$RUNNER_TEMP/wow-layout/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test atlas alignment and layers
        env:
          NODE_PATH: ${{ runner.temp }}/wow-layout/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/wow-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 - <<'PYREADY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/atlas.html', timeout=1)
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('Local site did not start')
          PYREADY
          node tests/core.cjs
          node tests/settings.cjs
          node tests/atlas-layout.cjs http://127.0.0.1:8765/
          node tests/stage2.cjs http://127.0.0.1:8765/
          node tests/stage3.cjs http://127.0.0.1:8765/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html atlas.html forever-theme.css hero-v4.css data.js data.json coverage.json app-core.js atlas.js home.js settings.js login-gates.jpg wow-forever-hero-3344.jpg wow-forever-hero-mobile.webp _site/
          cp -R maps _site/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

